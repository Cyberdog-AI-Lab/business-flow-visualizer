<title>{{TITLE}}</title>
<!--
  flow-visualize テンプレート。
  差し替え位置は、二重波かっこで囲んだ大文字の目印
  （TITLE / CORNER / COLHEAD / ROWHEAD / SVG / LEGEND / GLOSSARY / SOURCE）。
  重要: この解説文には目印そのものを書かないこと。単純な文字列置換をすると
  コメント内まで置換され、生成物が壊れる。置換前にコメントを除去する運用でもよい。
  自己完結（外部依存なし）。ページ本体は横スクロールさせず、図の枠内だけスクロールさせる。
  図は4ペイン構成：左上の角・列見出し（上に固定）・行見出し（左に固定）・本体（唯一スクロールする）。
  見出しのスクロールは本体に追従させる。本体は左ドラッグで掴んで動かせる。
-->
<style>
  :root{ --bg:#f8fafc; --ink:#0f172a; --muted:#64748b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:20px;margin:0 0 12px}
  .board{border:1px solid #e2e8f0;border-radius:12px;background:#fff;overflow:hidden;
    box-shadow:0 1px 3px rgba(15,23,42,.06)}
  svg{display:block}

  /* 図の枠：左上=角 / 上=列見出し（固定）/ 左=行見出し（固定）/ 右下=本体（スクロール） */
  .viewport{display:grid;
    grid-template-columns:var(--label-w) 1fr;
    grid-template-rows:var(--head-h) 1fr;
    height:min(78vh, var(--board-h));
    background:#fff}
  .corner{background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;
    font-size:11.5px;border-right:1px solid #334155}
  .colhead{overflow:hidden;background:#0f172a}
  .rowhead{overflow:hidden;border-right:1px solid #e2e8f0;background:#fff}
  .bodypane{overflow:auto;cursor:grab;overscroll-behavior:contain}
  .bodypane.panning{cursor:grabbing}
  .bodypane.panning *{user-select:none}
  .hint{font-size:11.5px;color:var(--muted);margin:8px 2px 0}
  .hint kbd{background:#f1f5f9;border:1px solid #cbd5e1;border-bottom-width:2px;border-radius:4px;
    padding:1px 5px;font-size:11px;font-family:inherit}
  .card{border:1px solid #e2e8f0;border-radius:12px;background:#fff;padding:16px 18px;margin-top:16px}
  .card h2{font-size:14px;margin:0 0 12px}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#334155}
  .sw{width:24px;height:16px;border-radius:4px;flex:0 0 auto}
  pre{margin:0;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:14px;
    font-size:11.5px;line-height:1.55;overflow-x:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  /* 用語（マウスオーバーで説明が出る） */
  .term{fill:#1d4ed8;text-decoration:underline dotted;cursor:help}
  .gl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:12.5px;line-height:1.7}
  .gl dt{font-weight:700;color:#1d4ed8;white-space:nowrap}
  .gl dd{margin:0;color:#334155}
  #tip{position:fixed;z-index:50;max-width:320px;padding:8px 11px;border-radius:8px;
    background:#0f172a;color:#f1f5f9;font-size:12px;line-height:1.6;
    box-shadow:0 6px 20px rgba(15,23,42,.28);pointer-events:none;opacity:0;transition:opacity .12s}
  #tip b{display:block;color:#93c5fd;margin-bottom:2px}
</style>

<div class="wrap">
  <h1>{{TITLE}}</h1>

  <div class="board">
    <!-- 4つの目印にそれぞれ svg を差し込む。座標系は共通で、各ペインは viewBox で切り出す。
         角=固定テキスト / 列見出し=上に固定 / 行見出し=左に固定 / 本体=唯一スクロールする。
         本体の defs に矢印マーカーを含めること:
         id="a" 通常(#334155) / id="ar" 手戻り(#dc2626) / id="at" on_overdue(#d97706)
         --label-w / --head-h / --board-h は生成時に実寸へ差し替える。 -->
    <div class="viewport" style="--label-w:160px; --head-h:56px; --board-h:900px">
      <div class="corner">{{CORNER}}</div>
      <div class="colhead" id="colhead">{{COLHEAD}}</div>
      <div class="rowhead" id="rowhead">{{ROWHEAD}}</div>
      <div class="bodypane" id="bodypane">{{SVG}}</div>
    </div>
  </div>
  <p class="hint">役割（行）と時系列（列）の見出しは固定されます。
    図の中はスクロールのほか、<kbd>ドラッグ</kbd>で掴んで動かせます。</p>

  <div class="card">
    <h2>凡例</h2>
    <!-- 図に登場した要素だけを出す。1件の雛形:
         div.lg の中に span.sw（色見本）＋日本語ラベル。ラベルは SPEC 5.5 の語に合わせる。 -->
    <div class="legend">{{LEGEND}}</div>
  </div>

  <div class="card">
    <h2>用語</h2>
    <dl class="gl">{{GLOSSARY}}</dl>
  </div>

  <div class="card">
    <h2>記法ソース（.flow）</h2>
    <pre>{{SOURCE}}</pre>
  </div>
</div>

<div id="tip"></div>
<script>
/* 見出しの固定：本体のスクロールに列見出し・行見出しを追従させる */
(function(){
  var body=document.getElementById('bodypane'),
      col=document.getElementById('colhead'),
      row=document.getElementById('rowhead');
  if(!body) return;
  /* 本体にスクロールバーが出ると、見出し側より本体のほうが余分にスクロールできてしまい、
     端で見出しがずれる。見出し側にバーの幅ぶんの余白を足して最大量を揃える。 */
  function fitScrollbar(){
    var sw=body.offsetWidth-body.clientWidth,   /* 縦バーの幅 */
        sh=body.offsetHeight-body.clientHeight; /* 横バーの高さ */
    if(col&&col.firstElementChild) col.firstElementChild.style.marginRight =sw+'px';
    if(row&&row.firstElementChild) row.firstElementChild.style.marginBottom=sh+'px';
  }
  fitScrollbar();
  window.addEventListener('resize',fitScrollbar);

  function sync(){
    if(col) col.scrollLeft=body.scrollLeft;
    if(row) row.scrollTop =body.scrollTop;
  }
  body.addEventListener('scroll',sync,{passive:true});

  /* 左ドラッグで掴んで動かす（既定の文字選択は抑止する） */
  var on=false,sx=0,sy=0,sl=0,st=0,moved=false;
  body.addEventListener('mousedown',function(e){
    if(e.button!==0) return;
    on=true; moved=false; sx=e.clientX; sy=e.clientY;
    sl=body.scrollLeft; st=body.scrollTop;
    body.classList.add('panning'); e.preventDefault();
  });
  window.addEventListener('mousemove',function(e){
    if(!on) return;
    var dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>2||Math.abs(dy)>2) moved=true;
    body.scrollLeft=sl-dx; body.scrollTop=st-dy;
    sync();   /* scroll イベントを待たずに見出しを合わせる */
  });
  window.addEventListener('mouseup',function(){
    if(!on) return;
    on=false; body.classList.remove('panning');
  });
})();
</script>

<script>
(function(){
  var tip=document.getElementById('tip');
  function show(e){
    var el=e.target.closest('.term'); if(!el) return;
    tip.innerHTML='<b>'+el.getAttribute('data-term')+'</b>'+el.getAttribute('data-desc');
    tip.style.opacity=1; move(e);
  }
  function move(e){
    var pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
    var x=e.clientX+pad, y=e.clientY+pad;
    if(x+w>innerWidth-8)  x=e.clientX-w-pad;
    if(y+h>innerHeight-8) y=e.clientY-h-pad;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  function hide(){ tip.style.opacity=0; }
  document.addEventListener('mouseover',show);
  document.addEventListener('mousemove',function(e){ if(tip.style.opacity==1) move(e); });
  document.addEventListener('mouseout',function(e){ if(e.target.closest('.term')) hide(); });
})();
</script>
