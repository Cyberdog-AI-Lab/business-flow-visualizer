<title>{{TITLE}}</title>
<!--
  flow-visualize テンプレート。
  差し替え位置は、二重波かっこで囲んだ大文字の目印（TITLE / SVG / LEGEND / SOURCE）。
  重要: この解説文には目印そのものを書かないこと。単純な文字列置換をすると
  コメント内まで置換され、生成物が壊れる。置換前にコメントを除去する運用でもよい。
  自己完結（外部依存なし）。ページ本体は横スクロールさせず、.board 内だけスクロールさせる。
-->
<style>
  :root{ --bg:#f8fafc; --ink:#0f172a; --muted:#64748b; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;}
  .wrap{max-width:1500px;margin:0 auto;padding:24px 20px 60px}
  h1{font-size:20px;margin:0 0 12px}
  .board{overflow-x:auto;border:1px solid #e2e8f0;border-radius:12px;background:#fff;
    box-shadow:0 1px 3px rgba(15,23,42,.06)}
  svg{display:block}
  .card{border:1px solid #e2e8f0;border-radius:12px;background:#fff;padding:16px 18px;margin-top:16px}
  .card h2{font-size:14px;margin:0 0 12px}
  .legend{display:flex;flex-wrap:wrap;gap:10px 16px}
  .lg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#334155}
  .sw{width:24px;height:16px;border-radius:4px;flex:0 0 auto}
  pre{margin:0;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:14px;
    font-size:11.5px;line-height:1.55;overflow-x:auto;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
</style>

<div class="wrap">
  <h1>{{TITLE}}</h1>

  <div class="board">
    <!-- 下の目印を、生成した svg 要素に差し替える。
         defs に矢印マーカーを含めること: id="a" 通常(#334155) /
         id="ar" 手戻り(#dc2626) / id="at" on_overdue(#d97706) -->
    {{SVG}}
  </div>

  <div class="card">
    <h2>凡例</h2>
    <!-- 図に登場した要素だけを出す。1件の雛形:
         div.lg の中に span.sw（色見本）＋日本語ラベル。ラベルは SPEC 5.5 の語に合わせる。 -->
    <div class="legend">{{LEGEND}}</div>
  </div>

  <div class="card">
    <h2>記法ソース（.flow）</h2>
    <pre>{{SOURCE}}</pre>
  </div>
</div>
